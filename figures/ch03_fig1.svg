<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Nine dimensions: Homo economicus sees one, any egoist needs five"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Nine dimensions: Homo economicus sees one, any egoist needs five</text><text x="64.00" y="56.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">Dimension</text><text x="236.00" y="56.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">What it records (Definition 1)</text><text x="478.00" y="56.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">A selfish agent still asks (Remark 1)</text><rect x="18.00" y="68.00" width="36.00" height="28.00" rx="5" fill="#66c2a5" fill-opacity="1.0"/><text x="36.00" y="86.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">d1</text><text x="64.00" y="86.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Consequences</text><text x="236.00" y="86.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">monetary cost, material outcome</text><text x="478.00" y="86.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">the only dimension Homo economicus sees</text><line x1="18.00" y1="101.00" x2="702.00" y2="101.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="105.00" width="36.00" height="28.00" rx="5" fill="#fc8d62" fill-opacity="1.0"/><text x="36.00" y="123.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">d2</text><text x="64.00" y="123.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Rights / Entitlements</text><text x="236.00" y="123.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">property rights, contracts</text><text x="478.00" y="123.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">Can I be punished for this?</text><line x1="18.00" y1="138.00" x2="702.00" y2="138.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="142.00" width="36.00" height="28.00" rx="5" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="36.00" y="160.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">d3</text><text x="64.00" y="160.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Fairness</text><text x="236.00" y="160.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">distributional and procedural justice</text><line x1="18.00" y1="175.00" x2="702.00" y2="175.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="179.00" width="36.00" height="28.00" rx="5" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="36.00" y="197.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">d4</text><text x="64.00" y="197.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Autonomy</text><text x="236.00" y="197.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">freedom of choice, voluntariness</text><line x1="18.00" y1="212.00" x2="702.00" y2="212.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="216.00" width="36.00" height="28.00" rx="5" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="36.00" y="234.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">d5</text><text x="64.00" y="234.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Privacy / Trust</text><text x="236.00" y="234.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">information asymmetry, fiduciary duty</text><line x1="18.00" y1="249.00" x2="702.00" y2="249.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="253.00" width="36.00" height="28.00" rx="5" fill="#fc8d62" fill-opacity="1.0"/><text x="36.00" y="271.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">d6</text><text x="64.00" y="271.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Social impact</text><text x="236.00" y="271.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">externalities, reputation</text><text x="478.00" y="271.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">Will this damage my reputation?</text><line x1="18.00" y1="286.00" x2="702.00" y2="286.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="290.00" width="36.00" height="28.00" rx="5" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="36.00" y="308.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">d7</text><text x="64.00" y="308.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Virtue / Identity</text><text x="236.00" y="308.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">self-image, character consistency</text><line x1="18.00" y1="323.00" x2="702.00" y2="323.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="327.00" width="36.00" height="28.00" rx="5" fill="#fc8d62" fill-opacity="1.0"/><text x="36.00" y="345.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">d8</text><text x="64.00" y="345.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Legitimacy</text><text x="236.00" y="345.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">institutional trust, rule compliance</text><text x="478.00" y="345.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">Will the contract be enforced?</text><line x1="18.00" y1="360.00" x2="702.00" y2="360.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="364.00" width="36.00" height="28.00" rx="5" fill="#fc8d62" fill-opacity="1.0"/><text x="36.00" y="382.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">d9</text><text x="64.00" y="382.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Epistemic status</text><text x="236.00" y="382.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">information quality, ambiguity</text><text x="478.00" y="382.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">Do I have enough information?</text><line x1="18.00" y1="397.00" x2="702.00" y2="397.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><rect x="18.00" y="405.00" width="12" height="12" rx="3" fill="#66c2a5"/><text x="36.00" y="415.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">visible to Homo economicus</text><rect x="245.20" y="405.00" width=