<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Four pathologies of market search, and the cycle proposed among them"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Four pathologies of market search, and the cycle proposed among them</text><rect x="18.00" y="62.00" width="330.00" height="112.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="18" y="62" width="330" height="4" rx="2" fill="#66c2a5"/><text x="32.00" y="89.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">1. Heuristic corruption</text><text x="32.00" y="110.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the gradient of h points away from the geodesic</text><text x="32.00" y="128.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">externalities, information asymmetry</text><line x1="32.00" y1="140.00" x2="334.00" y2="140.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="32.00" y="159.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">2008: securities priced by models that ignored tail risk</text><rect x="372.00" y="62.00" width="330.00" height="112.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="372" y="62" width="330" height="4" rx="2" fill="#fc8d62"/><text x="386.00" y="89.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">2. Objective hijacking</text><text x="386.00" y="110.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the search optimizes the wrong objective</text><text x="386.00" y="128.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">regulatory capture, short-termism</text><line x1="386.00" y1="140.00" x2="688.00" y2="140.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="386.00" y="159.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">2008: rating agencies dependent on issuers' fees</text><rect x="372.00" y="262.00" width="330.00" height="112.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="372" y="262" width="330" height="4" rx="2" fill="#8da0cb"/><text x="386.00" y="289.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">3. Local minima</text><text x="386.00" y="310.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the search is trapped in a suboptimal basin</text><text x="386.00" y="328.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">bubbles, poverty traps</text><line x1="386.00" y1="340.00" x2="688.00" y2="340.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="386.00" y="359.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">2008: the housing bubble, no one willing to exit first</text><rect x="18.00" y="262.00" width="330.00" height="112.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="18" y="262" width="330" height="4" rx="2" fill="#e78ac3"/><text x="32.00" y="289.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">4. Gauge breaking</text><text x="32.00" y="310.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the output depends on description, not content</text><text x="32.00" y="328.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">money illusion, framing effects</text><line x1="32.00" y1="340.00" x2="334.00" y2="340.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="32.00" y="359.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">2008: nominal house prices rose, real ones did not</text><line x1="350.00" y1="118.00" x2="370.00" y2="118.00" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="370.00" y1="118.00" x2="363.14" y2="122.12" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="370.00" y1="118.00" x2="363.14" y2="113.88" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="537.00" y1="176.00" x2="537.00" y2="258.00" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="537.00" y1="258.00" x2="532.88" y2="251.14" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="537.00" y1="258.00" x2="541.12" y2="251.14" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="370.00" y1="318.00" x2="350.00" y2="318.00" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="350.00" y1="318.00" x2="356.86" y2="313.88" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="350.00" y1="318.00" x2="356.86" y2="322.12" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="183.00" y1="260.00" x2="183.00" y2="178.00" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="183.00" y1="178.00" x2="187.12" y2="184.86" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="183.00" y1="178.00" x2="178.88" y2="184.86" stroke="#e8ecf0" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="360.00" y="214.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="normal">each enables or deepens the next</text><text x="360.00" y="231.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">(Proposition 10.2)</text><text x="16.00" y="410.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">schematic of the chapter's taxonomy and proposed cascade; not a measured result</text></svg>