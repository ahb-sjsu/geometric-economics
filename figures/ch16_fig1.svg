<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="A high wall can be crossed at a price; a disconnection cannot"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">A high wall can be crossed at a price; a disconnection cannot</text><rect x="18.00" y="48.00" width="333.00" height="284.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="18" y="48" width="333" height="4" rx="2" fill="#66c2a5"/><text x="32.00" y="76.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Boundary with a finite penalty</text><text x="32.00" y="94.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">a regulatory rule: β large, not infinite</text><ellipse cx="98.00" cy="196.00" rx="58.00" ry="70.00" transform="rotate(0 98.00 196.00)" fill="#66c2a5" fill-opacity="0.14" stroke="#66c2a5" stroke-width="2"></ellipse><text x="98.00" y="242.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">money</text><ellipse cx="271.00" cy="196.00" rx="58.00" ry="70.00" transform="rotate(0 271.00 196.00)" fill="#8da0cb" fill-opacity="0.14" stroke="#8da0cb" stroke-width="2"></ellipse><text x="271.00" y="242.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">the good</text><circle cx="98.00" cy="186.00" r="6.00" fill="#0b1622"/><circle cx="98.00" cy="186.00" r="4.00" fill="#e8ecf0"></circle><circle cx="271.00" cy="186.00" r="6.00" fill="#0b1622"/><circle cx="271.00" cy="186.00" r="4.00" fill="#e8ecf0"></circle><line x1="184.00" y1="136.00" x2="184.00" y2="266.00" stroke="#8fa4b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="1.0"/><polyline points="98.00,186.00 102.33,183.33 106.65,180.68 110.97,178.06 115.30,175.49 119.62,172.99 123.95,170.56 128.28,168.24 132.60,166.02 136.93,163.92 141.25,161.96 145.57,160.15 149.90,158.49 154.22,157.01 158.55,155.71 162.88,154.59 167.20,153.66 171.53,152.94 175.85,152.42 180.18,152.10 184.50,152.00 188.82,152.10 193.15,152.42 197.47,152.94 201.80,153.66 206.12,154.59 210.45,155.71 214.78,157.01 219.10,158.49 223.43,160.15 227.75,161.96 232.07,163.92 236.40,166.02 240.72,168.24 245.05,170.56 249.38,172.99 253.70,175.49 258.02,178.06 262.35,180.68 266.68,183.33 271.00,186.00" fill="none" fill-opacity="0.0" stroke="#e78ac3" stroke-width="2.5" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="271.00" y1="186.00" x2="263.00" y2="185.91" stroke="#e78ac3" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="271.00" y1="186.00" x2="267.33" y2="178.89" stroke="#e78ac3" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="184.00" y="126.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="middle" font-weight="normal">cost β</text><text x="184.00" y="306.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e8ecf0" text-anchor="middle" font-weight="normal">a path exists: the boundary can be evaded or bought</text><rect x="369.00" y="48.00" width="333.00" height="284.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="369" y="48" width="333" height="4" rx="2" fill="#fc8d62"/><text x="383.00" y="76.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Disconnected components</text