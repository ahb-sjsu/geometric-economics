# Dedicated PVC for LeBSE v2 (isolated from erebus/arc PVCs) + a tiny stage pod to receive data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lebse-v2
  namespace: ssu-atlas-ai
spec:
  accessModes: [ReadWriteMany]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: lebse-stage
  namespace: ssu-atlas-ai
  labels: { app: lebse-stage }
spec:
  restartPolicy: Never
  containers:
    - name: stage
      image: busybox:1.36
      command: ["sh", "-c", "sleep 100000"]
      volumeMounts:
        - { name: data, mountPath: /data }
      resources:
        requests: { cpu: "200m", memory: 256Mi }
        limits: { cpu: "500m", memory: 512Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lebse-v2
